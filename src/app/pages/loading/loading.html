@if (errorMessage()) {
<div class="error-overlay">
    <section class="error-dialog" role="alertdialog" aria-modal="true" aria-labelledby="error-title"
        aria-describedby="error-description">
        <button class="error-dialog__close" type="button" aria-label="Close error message" (click)="dismissError()">
            <img src="./assets/img/close.svg" alt="close">
        </button>
        <h2 id="error-title">{{ errorTitle() }}</h2>
        <p id="error-description">
            {{ errorMessage() }}
        </p>
        <div class="error-dialog__actions">
            <button type="button" (click)="backToIngredients()">
                Go back to ingredients
                <img src="./assets/img/Arrow-beige.svg" alt="" aria-hidden="true">
            </button>
        </div>
    </section>
</div>
}
<main class="loading">
    <section class="loading-section">
        <nav><img src="./assets/logo/Capa_2.svg" alt="logo"></nav>
        <div>
            <article>
                <img class="bowl-full" src="./assets/animation/bowl-back.svg" alt="bowl full">
                <img class="salat-light" src="./assets/animation/salat-light.svg" alt="lettuche">
                <img class="salat-dark" src="./assets/animation/salat-dark.svg" alt="lettuche">
                <img class="carrot" src="./assets/animation/karotte.svg" alt="carrot">
                <img class="gurke" src="./assets/animation/gurke.svg" alt="pickle">
                <img class="zitrone" src="./assets/animation/zitrone.svg" alt="lemon">
                <img class="thym" src="./assets/animation/thym.svg" alt="thym">
                <img class="bowl-front" src="./assets/animation/bowl-front.svg" alt="bowl-front">
            </article>
            <h2></h2>
        </div>
    </section>
</main>
