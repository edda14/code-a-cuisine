<main class="categorie">
    <section class="categorie-section">
        <header>
            <div routerLink="/cookbook"><img src="./assets/logo/Capa_3.svg" alt="logo">
                <div>
                    <img src="./assets/img/Arrow-left.svg" alt="arrow left">
                    <p>Back</p>
                </div>
            </div>
        </header>
        <article>
            <section class="button-section">
                <button>Generate a recipe</button>
            </section>
            <img src="./assets/img/Hero for cuisine page.svg" alt="header">
            <section class="recipe-list">
                <span>
                    <div class="recipe-title">
                        <span class="time"><img src="./assets/img/clock.svg" alt="clock">
                            <p>Cooking time: 20min</p>
                        </span>
                        <span class="title">
                            <div class="number-div">1.</div>
                            <p>Pasta with spinach and cherry tommatoes</p>
                        </span>
                    </div>
                    <div class="recipe-preference">
                        <div class="preference">Vegetarian</div>
                        <div class="time">Quick</div>
                        <div class="likes"><img src="./assets/img/favorite.svg" alt="heart">67</div>
                    </div>
                </span>

            </section>
        </article>
    </section>
</main>
